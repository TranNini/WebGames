<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#17161c">
    <script src="/theme.js"></script>
    <script src="/player.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Lane Dodge</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/game.css">
    <link rel="stylesheet" href="dodge.css">
</head>
<body>
<div class="screen">
    <main id="intro" class="intro">
        <div class="intro-text">
            <svg class="lanes-icon" viewBox="0 0 58 58" aria-hidden="true">
                <rect class="lane" x="0" width="18" height="58" rx="6"></rect>
                <rect class="lane" x="20" width="18" height="58" rx="6"></rect>
                <rect class="lane" x="40" width="18" height="58" rx="6"></rect>
                <rect class="block" x="2" y="10" width="14" height="10" rx="3" fill="#c2e6ff"></rect>
                <rect class="block" x="42" y="24" width="14" height="10" rx="3" fill="#ffc2ec"></rect>
                <rect class="you" x="23" y="44" width="12" height="10" rx="3"></rect>
            </svg>
            <h1>Lane Dodge</h1>
            <p>Tap or swipe left and right to change lanes and dodge the falling blocks. Three hits and the game ends.</p>
        </div>
        <button id="start" class="button primary">Start</button>
    </main>

    <main id="road" class="road" hidden>
        <canvas id="canvas" aria-label="The road: three lanes with falling blocks"></canvas>
    </main>
</div>
<script src="/sound.js"></script>
<script src="/game.js"></script>
<script src="dodge.js"></script>
</body>
</html>
