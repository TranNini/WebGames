<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#17161c">
    <script src="/theme.js"></script>
    <script src="/player.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Reflex Tap</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/game.css">
    <link rel="stylesheet" href="reflex.css">
</head>
<body>
<div class="screen">
    <main id="mission" class="mission">
        <div class="modes" role="group" aria-label="Mode">
            <button class="mode" data-mode="easy">Easy<small>4 colors</small></button>
            <button class="mode" data-mode="medium">Medium<small>6 colors</small></button>
            <button class="mode" data-mode="hard">Hard<small>8 colors</small></button>
        </div>
        <div class="mission-text">
            <div class="mission-title">Your mission</div>
            <h1>Don't tap this color</h1>
            <div id="mission-color" class="mission-color"></div>
            <div id="mission-name" class="mission-name"></div>
            <p>Tap every other color before it fades. Three missed and the game ends. One tap on this color ends it right away.</p>
        </div>
        <button id="start" class="button primary">Start</button>
    </main>

    <main id="board" class="board" hidden>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
        <button class="field"><span></span></button>
    </main>

</div>
<script src="/sound.js"></script>
<script src="/game.js"></script>
<script src="reflex.js"></script>
</body>
</html>
