<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#17161c">
    <script src="/theme.js"></script>
    <script src="/player.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Lane Dodge</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/game.css">
    <link rel="stylesheet" href="dodge.css">
</head>
<body>
<div class="screen">
    <main id="intro" class="intro">
        <div class="intro-text">
            <img class="dodge-icon" src="/dodge/icon.png" alt="">
            <h1>Lane Dodge</h1>
            <p>Tap or swipe left and right to help the cat dodge the cars, bikes, roller skates and skateboards coming her way. Three hits and the game ends.</p>
        </div>
        <button id="start" class="button primary">Start</button>
    </main>

    <main id="road" class="road" hidden>
        <canvas id="canvas" aria-label="The road: three lanes, with a cat running up them"></canvas>
    </main>
</div>
<script src="/sound.js"></script>
<script src="/game.js"></script>
<script src="scene.js"></script>
<script src="dodge.js"></script>
</body>
</html>
