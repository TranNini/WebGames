<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17161c">
    <script src="theme.js"></script>
    <script src="player.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="theme-button" class="theme-button" aria-label="Switch between dark and light mode">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>
<main class="page">
    <div>
        <h1>Games</h1>
        <a class="player" href="/name.html">Playing as <b id="player-name"></b> <span>Change</span></a>
    </div>
    <a class="game-card" href="/reflex/index.html">
        <span class="tiles" aria-hidden="true">
            <i style="background: #c2e6ff"></i><i style="background: #ffc2ec"></i>
            <i style="background: #c2ffe1"></i><i style="background: #fff7c2"></i>
        </span>
        <span>
            <strong>Reflex Tap</strong>
            <span class="about">Tap every color but one.</span>
        </span>
    </a>
    <a class="game-card" href="/dodge/index.html">
        <img class="dodge-icon" src="/dodge/icon.png" alt="">
        <span>
            <strong>Lane Dodge</strong>
            <span class="about">Help the cat dodge the traffic.</span>
        </span>
    </a>
    <a class="game-card" href="/math/index.html">
        <span class="sum-icon" aria-hidden="true">7×8</span>
        <span>
            <strong>Scribble Math</strong>
            <span class="about">Solve sums against the clock.</span>
        </span>
    </a>
    <a class="game-card" href="/mission/index.html">
        <img class="game-picture" src="/mission/icon.png" alt="">
        <span>
            <strong>Mission: Meow</strong>
            <span class="about">Fly through the lab and save the kittens.</span>
        </span>
    </a>
    <a class="game-card" href="/solitaire/index.html">
        <span class="cards-icon" aria-hidden="true">A<small>&#x2660;&#xFE0E;</small></span>
        <span>
            <strong>Solitaire</strong>
            <span class="about">No timer, one thumb. Take your time.</span>
        </span>
    </a>
</main>
<script src="home.js"></script>
</body>
</html>
