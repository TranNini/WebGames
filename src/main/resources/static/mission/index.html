<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#17161c">
    <script src="/theme.js"></script>
    <script src="/player.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Games">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Mission: Meow</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/game.css">
    <link rel="stylesheet" href="mission.css">
</head>
<body>
<div class="screen">
    <main id="intro" class="intro">
        <div class="intro-text">
            <img class="mission-picture" src="/mission/icon.png" alt="">
            <h1>Mission: Meow</h1>
            <p id="how">Kittens have been abducted! Hold to rise, let go to sink. Flying uses energy, and stars fill it up. With none left she walks, and a tap jumps, until she has collected a full bar. Go as far as you can.</p>
        </div>
        <button id="start" class="button primary">Loading...</button>
    </main>

    <main id="stage" class="stage" hidden>
        <canvas id="canvas" aria-label="The lab: she flies to the right"></canvas>
        <div class="hud">
            <img class="portrait" src="/mission/art/portrait.webp" alt="">
            <div id="wings" class="wings" aria-hidden="true">
                <img src="/mission/art/wing-frame.webp" alt="">
                <div id="energy" class="energy"></div>
            </div>
            <div class="saved" aria-label="Kittens saved"><img src="/mission/art/kitten-icon.webp" alt=""><b id="kittens">0</b></div>
        </div>
        <div id="notice" class="notice" hidden></div>
        <p class="turn">Hold your phone sideways for more room.</p>
    </main>
</div>
<script src="/sound.js"></script>
<script src="/game.js"></script>
<script src="scene.js"></script>
<script src="mission.js"></script>
</body>
</html>
