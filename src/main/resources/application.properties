# Reachable from other devices (the iPhone); they need the access code once
server.address=0.0.0.0
# 8080 Vocab app, 8081 TradeLog, 8082 SportTimer and the cookbook
server.port=8083

# The leaderboards live in this file. In Docker it is in /app/data instead (see the Dockerfile).
spring.datasource.url=jdbc:sqlite:games.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1
# Runs schema.sql on every start; it only creates the tables that are missing
spring.sql.init.mode=always

# Created on first start; delete it to get a new code (devices then need to log in again)
games.access-code-file=access-code.txt
# The login cookie is HTTPS only. To try the app on a phone over plain http at home, start with --games.cookie-secure=false
games.cookie-secure=true

# The jar gives every file the same 1980 date, so browsers would keep old copies of the scripts and styles.
# Make them ask for the current file every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true

# Behind caddy (https://games.kulose.de) the app itself only sees http: redirects are sent as "/login.html"
# instead of "http://…/login.html", so the browser stays on https
server.tomcat.use-relative-redirects=true
